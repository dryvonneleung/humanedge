name = "haa-value-prop"
main = "worker.js"
compatibility_date = "2025-01-01"

# Optional. Any model id from build.nvidia.com works, since NIM is
# OpenAI-compatible. Omit to use the default in worker.js.
[vars]
MODEL = "meta/llama-3.3-70b-instruct"

# Rate limiting for both the write-up and /collect. Ids are not secrets — they
# identify the namespace, they do not grant access to it.
#   npx wrangler kv namespace create RATE_LIMIT
# Without this binding the Worker still runs, just with no per-IP limit.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "fab35b21167e49a98d9824f6612bc795"

# Response collection (POST /collect, GET /export.csv, GET /stats).
#   npx wrangler d1 create haa-responses
#   npx wrangler d1 execute haa-responses --remote --file=./schema.sql
# Without this binding /collect returns 503 and the rest of the Worker is
# unaffected.
[[d1_databases]]
binding = "DB"
database_name = "haa-responses"
database_id = "473af6fd-9729-4b11-a65a-79bc78556e9d"

# The export endpoint needs a token. Never put it here — this file is committed.
#   openssl rand -hex 32 | npx wrangler secret put EXPORT_TOKEN
